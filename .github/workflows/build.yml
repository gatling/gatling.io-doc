name: Build

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # Every steps will have a /usr/bin/bash --noprofile --norc -e -o pipefail

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      - name: Build JVM code samples
        run: sbt "all headerCheckAll scalafmtSbtCheck;" "test;"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Hugo
        uses: ./.github/actions/setup-hugo
        with:
          hugo-version: '0.161.1'

      - name: Prepare project
        run: ./bin/entrypoint.sh prepare

      - name: Build TypeScript code samples
        run: npm run test-ts-samples

      - name: Generate documentation
        run: ./bin/entrypoint.sh --noprepare generate

      - name: Generate llms.txt files
        run: node bin/generate-llms-txt.js
