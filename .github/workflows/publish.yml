name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  id-token: write

defaults:
  run:
    shell: bash # Every steps will have a /usr/bin/bash --noprofile --norc -e -o pipefail

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://docs.gatling.io
    timeout-minutes: 10
    steps:
      - name: Checkout current project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials (for CodeArtifact)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.GATLING_BOT_GITHUB_CI }}
          aws-region: us-east-1

      - name: Prepare SBT environment
        env:
          PRIVATE_REPOSITORY_SBT: ${{ vars.PRIVATE_REPOSITORY_SBT_2 }}
        run: |
          mkdir --parents ~/.config/sbt/2 || true
          echo "$PRIVATE_REPOSITORY_SBT" > ~/.config/sbt/2/privateRepository.sbt

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: '25'
          # no cache

      - name: Setup sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Build JVM code samples
        run: sbt "all headerCheckAll scalafmtSbtCheck;" "test;"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # no cache

      - name: Setup Hugo
        uses: ./.github/actions/setup-hugo
        with:
          hugo-version: '0.161.1'

      - name: Prepare project
        run: ./bin/entrypoint.sh prepare

      - name: Build TypeScript code samples
        run: npm run test-ts-samples

      - name: Generate documentation
        run: ./bin/entrypoint.sh --noprepare generate

      - name: Generate llms.txt files
        run: node bin/generate-llms-txt.js

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-3
          role-to-assume: ${{ vars.AWS_ROLE_PROD_DOC }}

      - name: Deploy
        env:
          HUGO_DEPLOYMENT_BUCKET: ${{ vars.HUGO_DEPLOYMENT_BUCKET }}
          HUGO_DEPLOYMENT_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.HUGO_DEPLOYMENT_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          sed -i "s/HUGO_DEPLOYMENT_BUCKET/$HUGO_DEPLOYMENT_BUCKET/" config/production/config.yaml
          sed -i "s/HUGO_DEPLOYMENT_CLOUDFRONT_DISTRIBUTION_ID/$HUGO_DEPLOYMENT_CLOUDFRONT_DISTRIBUTION_ID/" config/production/config.yaml
          hugo deploy --maxDeletes -1 --invalidateCDN
